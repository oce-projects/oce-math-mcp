[project]
name = "oce-math-mcp"
dynamic = ["version"]
description = "Mathematics MCP server for Qwen3.6: exact, symbolic and numerical calculations, number theory, answer checking, Italian calendar, 3D geometry and engineering formulas."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
    "pydantic>=2.10",
    "sympy>=1.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "mpmath>=1.3",
    "tzdata>=2024.1",
]

[project.scripts]
oce-math-mcp = "oce_math_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "basedpyright>=1.20",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/oce_math_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["lean"]

[tool.ruff.format]
# LF line endings as in .gitattributes (eol=lf), also on Windows.
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
# The formatter keeps code at 100 columns; long strings and comments up to 130.
max-line-length = 130

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
